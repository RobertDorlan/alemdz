<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALEMDZ — Marca personal, blog y portafolio</title>
  <meta
    name="description"
    content="ALEMDZ: marca personal, blog y portafolio. Historia, tips de belleza, tricología, servicios y reservas."
  />

  <!-- Tipografía editorial: fina, elegante y moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============================================================= -->
  <!-- 1. ENCABEZADO PRINCIPAL                                       -->
  <!-- Logotipo tipográfico "ALEMDZ" centrado. Menú discreto a la    -->
  <!-- izquierda, redes sociales a la derecha. Enlaza a inicio.      -->
  <!-- ============================================================= -->
  <header class="site-header">
    <div class="site-header__inner">
      <!-- Izquierda: icono de menú discreto -->
      <div class="site-header__left">
        <button
          class="menu-toggle"
          type="button"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          <span class="menu-toggle__bar"></span>
          <span class="menu-toggle__bar"></span>
          <span class="menu-toggle__bar"></span>
        </button>
      </div>

      <!-- Centro: logotipo tipográfico (enlace a inicio) -->
      <div class="site-header__center">
        <a class="brand" href="/" aria-label="ALEMDZ — Ir a la página de inicio">
          ALEMDZ
        </a>
      </div>

      <!-- Derecha: redes sociales discretas -->
      <div class="site-header__right">
        <a
          class="social-link"
          href="https://instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <rect x="3" y="3" width="18" height="18" rx="5" ry="5"
              fill="none" stroke="currentColor" stroke-width="1.4" />
            <circle cx="12" cy="12" r="4"
              fill="none" stroke="currentColor" stroke-width="1.4" />
            <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" />
          </svg>
        </a>
      </div>
    </div>

    <!-- Menú desplegable (usado sobre todo en móvil, disponible en todos los tamaños) -->
    <nav id="site-nav" class="site-nav" aria-label="Navegación principal" hidden>
      <ul class="site-nav__list">
        <li><a href="/mi-historia">Mi historia</a></li>
        <li><a href="/tips-de-belleza">Tips de belleza</a></li>
        <li><a href="/tricologia">Tricología</a></li>
        <li><a href="/servicios-y-precios">Servicios y Precios</a></li>
        <li><a href="/bookings">Bookings</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- ============================================================= -->
    <!-- 2. FOTOGRAFÍA PANORÁMICA DEL ESTUDIO                          -->
    <!--                                                               -->
    <!-- SUSTITUIR la imagen provisional por la foto real del estudio: -->
    <!--   public/images/studio/alemdz-studio-hero.jpg                 -->
    <!--                                                               -->
    <!-- Requisitos: horizontal / panorámica, ancho completo,          -->
    <!-- object-fit: cover, sin bordes redondeados, sin tarjeta.       -->
    <!-- ============================================================= -->
    <section class="studio-hero" aria-label="Fotografía del estudio de ALEMDZ">
      <img
        class="studio-hero__img"
        src="public/images/studio/alemdz-studio-hero.jpg"
        alt="Estudio de ALEMDZ: espacio profesional de peluquería, luminoso y cuidado, con estaciones de trabajo y una estética editorial."
        loading="eager"
        decoding="async"
      />
    </section>

    <!-- ============================================================= -->
    <!-- 3. MENÚ VISUAL CON CÍRCULOS                                   -->
    <!-- Cinco accesos circulares. Orden fijo. Toda la superficie es   -->
    <!-- clicable. Hover discreto y estados de foco visibles.          -->
    <!--                                                               -->
    <!-- Imágenes/texturas de cada círculo (sustituir por reales):     -->
    <!--   public/images/circles/mi-historia.jpg                       -->
    <!--   public/images/circles/tips-de-belleza.jpg                   -->
    <!--   public/images/circles/tricologia.jpg                        -->
    <!--   public/images/circles/servicios-y-precios.jpg               -->
    <!--   public/images/circles/bookings.jpg                          -->
    <!-- ============================================================= -->
    <section class="circles" aria-labelledby="circles-title">
      <h2 id="circles-title" class="circles__title">Explora mi mundo</h2>

      <ul class="circles__grid">
        <li class="circle-item">
          <a class="circle" href="/mi-historia">
            <span
              class="circle__media"
              style="background-image: url('public/images/circles/mi-historia.jpg');"
              aria-hidden="true"
            ></span>
            <span class="circle__overlay" aria-hidden="true"></span>
            <span class="circle__label">Mi historia</span>
          </a>
        </li>

        <li class="circle-item">
          <a class="circle" href="/tips-de-belleza">
            <span
              class="circle__media"
              style="background-image: url('public/images/circles/tips-de-belleza.jpg');"
              aria-hidden="true"
            ></span>
            <span class="circle__overlay" aria-hidden="true"></span>
            <span class="circle__label">Tips de belleza</span>
          </a>
        </li>

        <li class="circle-item">
          <a class="circle" href="/tricologia">
            <span
              class="circle__media"
              style="background-image: url('public/images/circles/tricologia.jpg');"
              aria-hidden="true"
            ></span>
            <span class="circle__overlay" aria-hidden="true"></span>
            <span class="circle__label">Tricología</span>
          </a>
        </li>

        <li class="circle-item">
          <a class="circle" href="/servicios-y-precios">
            <span
              class="circle__media"
              style="background-image: url('public/images/circles/servicios-y-precios.jpg');"
              aria-hidden="true"
            ></span>
            <span class="circle__overlay" aria-hidden="true"></span>
            <span class="circle__label">Servicios y Precios</span>
          </a>
        </li>

        <li class="circle-item">
          <a class="circle" href="/bookings">
            <span
              class="circle__media"
              style="background-image: url('public/images/circles/bookings.jpg');"
              aria-hidden="true"
            ></span>
            <span class="circle__overlay" aria-hidden="true"></span>
            <span class="circle__label">Bookings</span>
          </a>
        </li>
      </ul>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
